<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>함수</title>

  <script>
    // 함수 : 특정한 결과를 얻기 위해서 필요한 데이터와 소스코드들을 하나의 이름으로 묶어놓은 것
  //   메소드와 함수의 차이점 - 혼자서 선언되고 사용되면 함수라 하고, 클래스의 멤버로 포함되어 있는 함수를 메소드라고 함
  //   자바스크립트에서 함수 선언 시 'function' 키워드를 사용함
  //   자바스크립트의 변수는 모든 데이터 타입을 저장할 수 있기 때문에 함수의 매개변수 부분에 데이터 타입을 입력하지 않음
  //   자바스크립트의 함수는 반환 타입을 지정하지 않음, 반환값이 있을 경우 return 만 입력
  //   자바스크립트의 함수는 변수에 저장하여 사용 가능
  //   자바의 메소드와 동일하게 자바스크립트의 함수도 4가지의 형태가 있음
  //      1. 매개변수와 반환값이 모두 없는 함수
  //      2. 매개변수는 존재하고, 반환값이 없는 함수
  //      3. 매개변수는 없고, 반환값이 존재하는 함수
  //      4. 매개변수와 반환값이 모두 존재하는 함수

  //   사용법(선언)
  //   function 함수명(매개변수1, 매개변수2, ...) {
  //      함수 호출 시 실행할 소스코드 ... ;
  //   }
  //
  //   변수에 이름이 없는 함수를 저장한 후 변수명을 사용하여 함수를 대신 호출할 수 있음
  //   const 변수명 = function(매개변수1, 매개변수2, ... ) {
  //      함수 호출 시 실행할 소스코드
  //   }

  //   사용법(호출)
  //   함수명(매개변수1, 매개변수2, ... );
  //   변수명(매개변수1, 매개변수2, ... );

    // 1번 방식의 함수 선언, 매개변수, 반환값 모두 없음
    function sum() {
        let num1 = 2;
        let num2 = 3;
        let result = num1 + num2;
        console.log('결과 : ' + result);
    }

    // 2번 방식의 함수 선언, 매개변수는 있고, 반환값은 없음
    function sub(num1, num2) {
        let result = num1 - num2;
        console.log('결과 : ' + result);
    }

    // 4번 방식의 함수 선언, 매개변수와 반환값이 모두 있음
    function multi(num1, num2) {
        let result = num1 * num2;
        return result;
    }

    // 3번 방식의 함수 선언, 매개변수는 없고, 반환값이 존재하는 함수
    function div() {
        let num1 = 10;
        let num2 = 20;
        let result = num1 * num2;
        return result;
    }

    sum();
    sub(10, 5);
    let result = multi(10, 3);
    console.log(result);
    result = div();
    console.log(result);

    console.log('\n----- 익명함수 -----\n');

  //   익명함수 : 함수의 이름이 없는 함수, 자바스크립트에서는 변수에 함수를 저장할 수 있기 때문에 익명함수는 주로 변수에 저장하여 변수명으로 대신 호출해서 사용하거나, 다른 함수의 매개변수로 활용됨
  //   const 변수명 = function(매개변수, ...);
  //   변수명(매개변수, ...);

    var sum2 = function() {
        let num1 = 20;
        let num2 = 30;
        console.log('두 수의 덧셈은 ' + (num1 + num2));
    }

    var sub2 = function(num1, num2) {
        console.log('두 수의 뺄셈은 ' + (num1 - num2));
    }

    var multi2 = function() {
        let num1 = 20;
        let num2 = 30;
        return num1 * num2;
    }

    var div2 = function(num1, num2) {
        return num1 / num2;
    }

    sum2();
    sub2(10, 5);
    result = multi2();
    console.log(result);
    result = div2(10, 3);
    console.log(result);

    console.log('\n ----- 콜백 함수 -----\n');
  //   콜백 함수 : 함수의 매개변수로 함수를 전달하여 호출된 함수 내에서 매개변수로 받은 함수를 실행하는 함수
  //   함수 호출 시 매개변수로 함수를 직접 입력 시 익명함수를 주로 사용
  //   미리 선언한 함수를 매개변수로 전달하는 것도 가능함

    function sayHello(name, callback) {
        const words = '안녕하세요. 내 이름은 ' + name + ' 입니다.';

        callback(words);
    }

    sayHello("원이", function (name) {
        console.log(name);
    });


    setTimeout(function() {
        alert('타이머 동작하기');
    }, 3000);


    // 익명함수를 변수에 저장하여 변수명을 통해서 익명함수를 대신 호출하여 사용
    const test1 = function() {
        console.log('익명함수를 변수에 넣어서 사용!!');
    }

    // 익명함수이지만 변수에 저장되어 이름이 있는 것으로 판단되기 때문에 변수명으로 함수를 여러번 호출 할 수 있음
    test1();
    test1();
    test1();
    test1();
    test1();

    console.log('\n ----- 즉시 실행 함수 -----\n');
    // 익명함수만 선언하면 이름이 없기 때문에 해당 익명함수를 호출할 수 없음
    // 1회용으로 단 한번만 실행하고자 할 경우 익명함수를 () 로 감싸서 즉시 실행함수로 사용할 수 있음
    (function () {
        console.log('익명함수라서 호출이 불가능함');
        console.log('함수 호출을 위한 ()를 함수 뒤에 추가하고, 함수 전체를 () 로 감싸서 사용');
    }());

    // 매개변수가 있을 경우 실행을 위한 () 안에 매개변수값을 입력하여 사용
    (function(num1, num2) {
        console.log('즉시 실행 함수에서 두수의 덧셈은 ' + (num1 + num2));
    }(10, 20));


  </script>
</head>
<body>

</body>
</html>
