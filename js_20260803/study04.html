<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>반복문</title>

  <script>
    // 반복문 : 자바의 반복문과 동일함
  //   for : 자바의 for 문과 동일함, 반복수를 알고 있을 경우에 사용하는 반복문
    let total = 0;

    // 카운트 변수, 조건식, 증감식을 한 곳에 선언
    for (let i = 1; i <= 10; i++) {
        total += i;
    }
    console.log('1 ~ 10 의 합은 ' + total + '입니다.');

  //   while : 자바의 while 문과 동일함, 조건식의 결과가 true 일 경우 사용하는 반복문
    let tree = 0; // 카운트 변수를 while 문 밖에 선언

    while (tree < 10) {
        tree += 1; // 증감식을 while 문 안에 선언

        console.log('나무를 ' + tree + '번 찍었습니다.');

        if (tree == 10) {
            console.log('나무가 넘어갑니다.');
            break;
        }
    }
  //   do ~ while : 자바의 do ~ while 문과 동일함, 조건식의 결과와 상관없이 무조건 1번은 실행하는 반복문
    do {
        console.log('나무를 ' + tree + '번 찍었습니다.');
        tree++;
    } while (tree < 10);

  //   for ~ in : 자바의 향상된 for 문과 비슷한 형태의 반복문
  //       배열 혹은 object 타입에 저장된 모든 내용을 출력할때까지 반복 실행함

  //   사용법
  //   for (변수명 in 배열 혹은 object) {
  //      반복 실행할 소스코드 ... ;
  //   }

    const car = ['레이EV', 'EV3', 'EV4', 'EV5', 'EV6', 'EV9'];

    console.log('\n ----- 기본 for 문으로 출력 -----');

    for (let i = 0; i < car.length; i++) {
        console.log('자동차 이름 : ' + car[i]);
    }

    console.log('\n ----- for ~ in 문으로 출력 -----');
    // for ~ in 문에 배열을 사용 시 배열의 index 번호를 가져옴

    for (let i in car) {
        console.log('자동차 이름 : ' + car[i] + ', i : ' + i);
    }

    const objCar = {name : 'ev3', size : '준중형', type : '세단', fuel : '전기', price : 4000};

    console.log('\n ----- object 타입을 for ~ in 으로 출력 -----');
    // object 타입은 일반 for 문으로 내용을 출력할 수 없음
    // object 타입의 for ~ in 문을 사용해야 object 의 모든 내용을 출력할 수 있음
    // object 타입을 for ~ in 문을 통해서 내용을 출력할 경우 'object명.key명'을 사용할 수 없고, 'object명[key명]' 형태로 사용해야 함

    for (let item in objCar) {
        // console.log(item + " : " + objCar.item);
        console.log(item + " : " + objCar[item]);
    }

  //   break / continue  : 자바의 break / continue 문과 동일함

    for (let i = 1; i < 10; i++) {

        if (i == 5) {
            console.log('구구단을 종료합니다.')
            break;
        }
        console.log('5 * ' + i + ' = ' + 5 * i);
    }

    console.log("\n");

    for (let i = 1; i < 10; i++) {

        if (i == 5) {
            console.log('다음 번으로 넘어갑니다.');
            continue;
        }
        console.log('5 * ' + i + ' = ' + 5 * i);
    }
  </script>
</head>
<body>

</body>
</html>
