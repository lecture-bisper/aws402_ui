<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>object 타입</title>

  <script>
      // object 타입 : 배열과 같이 하나의 변수명으로 여러개의 데이터를 입력할 수 있는 데이터 타입
      //   index가 없고 대신 key 와 value 로 데이터를 구분하는 방식(Java의 HashMap 과 같음)
      //   index가 없어서 데이터가 순차적으로 저장되지 않음
      //   key 와 value 가 1:1 로 연동되어 있으며, key 는 중복불가, value 는 중복 가능
      //   배열과 같이 비슷한 데이터를 저장하기보다는 특정한 사물의 전체 특징을 저장하는데 주로 사용
      //   기호는 {} 를 사용, key 와 value 의 구분은 ' : ' 을 사용하며, 각각의 데이터 구분은 ' , ' 를 사용
      //   사용 시 '변수명[key명]' 이나 '변수명.key명' 형태로 사용
      //   데이터 저장 시 존재하지 않는 key 명을 입력하면 데이터 추가로 인식
      //   object 타입에는 배열처럼 관련 함수가 없음
      //   object 타입은 클래스와 비슷한 형태의 구조를 가지고 있음

      //   사용법(선언)
      //   const object변수명 = {}; // 빈 object 타입 선언
      //   const object변수명 = {key1:value1, key2:value2, key3:value3, ...}; // object 타입 선언과 동시에 데이터 입력

      //   사용법(사용)
      //   object변수명[key명] = 데이터; // 지정한 key 에 데이터 입력
      //   object변수명.key명 = 데이터; // 지정한 key 에 데이터 입력
      //   object변수명[key명]; // 지정한 key 와 연동된 value 를 출력
      //   object변수명.key명; // 지정한 key 와 연동된 value 를 출력

      const car = {name: '아이오닉6', size: '중형', type: '세단', fuel: '전기', price: 5000};

      console.log('원본 object 타입 car : ');
      console.log(car);
      console.log('이름 : ' + car.name);
      console.log('타입 : ' + car['type']);
      console.log('크기 : ' + car.size);
      console.log('가격 : ' + car['price']);

      // 기존에 존재하는 key 에 value 를 대입 시 데이터 수정
      // 기존에 존재하지 않는 key 에 value 를 대입 시 데이터가 추가됨
      car.color = '화이트';
      console.log('기존에 없는 key 에 value 를 대입 후 object 타입 car : ');
      console.log(car);
      console.log('색상 : ' + car.color);

      const arrCar = ["아이오닉6", '중형', '세단', '전기', '5000'];
      console.log('배열로 사용 시 arrCar : ');
      console.log(arrCar);

      // object 타입의 변수 obj 선언
      const obj = {
          key1: 100,
          key2: 200,
          // object 타입의 요소로 함수를 저장
          fun1: function () {
              alert('알림창 출력');
          },
          fun2: function (a, b) {
              alert('두 수의 덧셈은 ' + (a + b));
          }
      }

      console.log(obj.key1);
      console.log(obj.key2);
      obj.fun1();
      obj.fun2(10, 20);
  </script>
</head>
<body>

</body>
</html>
