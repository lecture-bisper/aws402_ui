<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>연산자</title>

  <script>
    //  연산자 : 기본적으로 자바의 연산자와 사용방법이 동일함
  //   산술 연산자 : 산술 연산을 위한 +, -, *, /, % 연산자
    var a = 10;
    var b = 20;
    var result = a + b;
    console.log('두 수의 덧셈은 ' +  result + ' 입니다.');
    result = a - b;
    console.log('두 수의 뺄셈은 ' + result + ' 입니다.');
    result = a * b;
    console.log('두 수의 곱셈은 ' + result + ' 입니다.');
    a = 10;
    b = 3;
    result = a / b;
    console.log('두 수의 나눗셈은 ' + result + ' 입니다.');
    result = a % b;
    console.log('두 수를 나눈 나머지는 ' + result + ' 입니다.');

  //   문자열 연결 연산자 : 2개 이상의 문자열을 하나의 문자열로 연결하기 위한 연산자
    result = ' + 기호는 ' + '2개 이상의 문자열을' + ' 하나로 연결' + '할 경우 사용함';
    console.log(result);

  //   비교 연산자 : 두 피연산자의 값을 비교하기 위한 연산자, <, >, <=, >=, ==, !=, ===, !==
  //      === : 같음, == 와 동일한 연산자이지만 자바스크립트의 == 은 값만 확인하여 '10' == 10 은 같다고 판단함, === 는 데이터 타입까지 엄격하게 확인하여 '10' === 10 은 같지 않다고 판단함
  //      !== : 같지않음, != 와 동일한 연산자이지만 자바스크립트의 != 은 값만 확인하고, !=== 은 데이터 타입까지 엄격하게 확인함
    a = 10;
    b = 20;
    console.log('10 < 20 는 ' + (a < b));
    console.log('10 > 20 는 ' + (a > b));
    console.log('10 <= 20 는 ' + (a <= b));
    console.log('10 >= 20 는 ' + (a >= b));
    console.log('10 == 20 는 ' + (a == b));
    console.log('10 != 20 는 ' + (a != b));

    a = 10; // 데이터 타입이 숫자인 정수 10
    b = '10'; // 데이터 타입이 문자열인 숫자 10
    console.log('10 == "10" 은 ' + (a == b));
    console.log('10 === "10" 은 ' + (a === b));
    console.log('10 != "10" 은 ' + (a != b));
    console.log('10 !== "10" 은 ' + (a !== b));

  //   논리 연산자 : 좌측, 우측의 결과에 따라서 최종 결과가 true/false 인지를 판단하는 연산자
  //   &&(and), ||(or), !(not)
    a = 10;
    b = 20;
    console.log(a == 5 && b == 20);
    console.log(a == 5 || b == 20);
    console.log(!(a == 5));

  //   증감 연산자 : ++, -- 로 데이터를 1 증가 혹은 1 감소 시키는 연산자
    console.log('원본 a : ' + a);
    a++;
    a++;
    console.log('증가 후 a : ' + a);
    a--;
    console.log('감소 후 a : ' + a);
  </script>
</head>
<body>

</body>
</html>
