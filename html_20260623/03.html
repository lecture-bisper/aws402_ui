<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>form 사용하기</title>
</head>

<body>
  <div>
    <h2>form 태그 사용하기</h2>

    <div>
      <form action="03-1.html" method="get">
        <label>input 태그 사용 : </label>
        <input type="text" name="num1">

        <br>

        <!-- label 태그의 for 속성값과 input 태그의 id 속성값이 같을 경우 사용자가 label 태그를 클릭 시 input 태그를 클릭한 것으로 인식함 -->
        <label for="text">input 태그 사용 : </label>
        <!-- value 속성에 값을 입력해 놓으면 현재 페이지 로딩 시 자동으로 input 태그에 값을 채워놓음 -->
        <input type="text" id="text" name="basic" value="기본값 입력">

        <br><br>

        <h3>password 사용</h3>
        <label for="pwd">비밀번호 입력 : </label>
        <input type="password" id="pwd" name="pass">

        <br>

        <h3>email 사용</h3>
        <label for="email">이메일 입력 : </label>
        <input type="email" id="email" name="userEmail">

        <br><br>

        <h3>checkbox 사용</h3>
        <!-- checkbox : input 태그의 type을 checkbox 로 설정 시 사용할 수 있는 태그 -->
        <!-- 사용자의 입력을 true/false 로 입력받을 수 있는 태그 -->

        <!-- name속성 : input 태그가 저장하고 있는 value 속성값을 서버로 전송 시 서버에서 알아볼 수 있는 데이터의 이름 설정 -->

        <!-- checkbox 의 name 속성값을 동일하게 설정 시 배열로 하나의 이름으로 여러개의 데이터가 서버로 전달 됨 -->

        <div>
          <input type="checkbox" id="chk1" name="chk1" value="사과"><label for="chk1">사과</label>
          <input type="checkbox" id="chk2" name="chk2" value="수박"><label for="chk2">수박</label>
          <input type="checkbox" id="chk3" name="chk3" value="딸기"><label for="chk3">딸기</label>
        </div>

        <br>

        <h3>radio 사용</h3>
        <!-- radio : input 태그의 속성을 radio 로 설정 시 사용할 수 있는 태그 -->
        <!-- 사용자가 주어진 여러개의 값 중 하나를 선택하는 태그 -->
        <!-- radio 의 name 속성은 checkbox 와 달리 동일한 이름으로 묶어서 사용 -->
        <!-- name 속성을 동일한 이름으로 묶지 않을 경우 다른 그룹으로 인식함 -->

        <div>
          <input type="radio" id="radio1" name="radio1" value="사과"><label for="radio1">사과</label>
          <input type="radio" id="radio2" name="radio1" value="수박"><label for="radio2">수박</label>
          <input type="radio" id="radio3" name="radio1" value="딸기"><label for="radio3">딸기</label>
          <input type="radio" id="radio4" name="radio2" value="참외"><label for="radio4">참외</label>
          <input type="radio" id="radio5" name="radio2" value="복숭아"><label for="radio5">복숭아</label>
        </div>

        <br><br>

        <button type="submit">전송</button>
      </form>

      <br>

      <form action="03-01.html" method="get">
        <h3>search 사용하기</h3>
        <label for="search">검색 : </label>
        <input type="search" id="search" name="search">

        <br>

        <h3>url 사용하기</h3>
        <label for="url">URL : </label>
        <input type="url" id="url" name="url">

        <br>

        <h3>tel 사용하기</h3>
        <label for="tel">전화번호 : </label>
        <input type="tel" id="tel" name="tel">

        <br>

        <h3>number 사용하기</h3>
        <!-- min : 최소값 설정 -->
        <!-- max : 최대값 설정 -->
        <!-- step : 화살표 클릭 및 범위 이동 시 한번에 변경되는 숫자의 크기 설정 -->
        <label for="num">숫자 : </label>
        <input type="number" id="num" name="num" min="0" max="10" value="5" step="2">

        <br>

        <h3>range 사용하기</h3>
        <label for="range">범위 : </label>
        <input type="range" id="range" name="range" min="0" max="10" value="5" step="2">

        <br>

        <h3>date 사용하기</h3>
        <label for="date">날짜 : </label>
        <input type="date" id="date" name="date">

        <br>

        <h3>month 사용하기</h3>
        <label for="month">월 : </label>
        <input type="month" id="month" name="month">

        <br>

        <h3>week 사용하기</h3>
        <label for="week">주 : </label>
        <input type="week" id="week" name="week">

        <br>

        <h3>time 사용하기</h3>
        <label for="time">시간 : </label>
        <input type="time" id="time" name="time">

        <br>

        <h3>datetime-local 사용하기</h3>
        <label for="dt">날짜시간 : </label>
        <input type="datetime-local" id="dt" name="dt">

        <br>

        <button type="submit">전송</button>
      </form>

      <br><br>

      <form action="03-1.html" method="get">
        <h3>button, reset, submit 사용하기</h3>
        <!-- input 태그의 type 설정을 사용하여 버튼으로 만들어서 사용 -->
        <!-- 해당 버튼에 기능을 추가하려면 자바스크립트를 사용해야 함 -->
        <input type="button" value="input의 button 사용">
        <!-- reset 버튼은 form 태그 안에 사용된 input 태그의 내용을 초기화 -->
        <input type="reset" value="input의 reset 사용">
        <!-- submit 버튼은 해당 form 태그 안에서 사용된 input 태그가 가지고 있는 데이터를 form 태그에서 지정한 URL로 데이터를 전달 -->
        <input type="submit" value="input의 submit 사용">

        <br><br>

        <!-- <button> 태그는 <input type="button"> 과 동일한 기능을 하는 태그 -->
        <!-- html5에서 버튼의 기능만을 위한 시멘틱태그인 <button> 을 추가함 -->
        <!-- type은 button, reset, submit 을 설정할 수 있음 -->
        <!-- button 태그는 value 속성이 없음, 시작 태그와 끝 사이에 내용을 입력함 -->
        <button type="button">button의 button 사용</button>
        <button type="reset">button의 reset 사용</button>
        <button type="submit">button의 submit 사용</button>

        <br><br>

        <label for="txt1">첫번째 textbox</label>
        <!-- required : 해당 태그에 사용자가 입력한 내용이 있는지 없는지 확인, 있으면 통과/없으면 오류 -->
        <input type="text" id="txt1" name="txt1" value="" autofocus placeholder="한글로 입력하세요" required>
        <br>
        <label for="txt2">두번째 textbox</label>
        <!-- readonly : 읽기 전용으로 설정, 데이터를 수정할 수 없음 -->
        <input type="text" id="txt2" name="txt2" value="기본 텍스트" readonly>
        <br>
        <label for="txt3">세번째 textbox</label>
        <!-- disabled : 해당 태그를 사용할 수 없도록 하는 설정 -->
        <!-- disabled 속성 사용 시 해당 태그의 데이터를 서버로 전달할 수 없음 -->
        <input type="text" id="txt3" name="txt3" value="세번째 기본 텍스트" disabled>

        <br>

        <h3>file, hidden 사용하기</h3>
        <label for="file">첨부 파일 : </label>
        <input type="file" id="file" name="file">
        <input type="hidden" name="hide" value="숨겨진 값">

      </form>

      <br><br>

      <h3>textarea 사용하기</h3>
      <form action="03-1.html" method="get">
        <label for="comment">게시글 입력 : </label>
        <textarea id="comment" name="comm" rows="3" cols="80"></textarea>

        <br><br>
        <button type="submit">전송</button>
      </form>

      <br><br>

      <h3>select 사용하기</h3>
      <form action="03-1.html" method="get">
        <label for="sel1">과일 선택(단일 선택) : </label>
        <select id="sel1" name="sel1">
          <option value="apple">사과</option>
          <option value="banana">바나나</option>
          <option value="pear" selected>배</option>
        </select>

        <br><br>

        <label for="sel2">과일 선택(다중 선택) : </label>
        <select id="sel2" name="sel2" multiple size="5">
          <option value="apple">사과</option>
          <option value="banana" selected>바나나</option>
          <option value="pear">배</option>
          <option value="peach" selected>복숭아</option>
          <option value="orange">오렌지</option>
        </select>

        <br><br>

        <label for="data">웹 브라우저 선택 : </label>
        <input type="text" list="browsers" name="browsers">
        <datalist id="browsers">
          <option value="Edge">엣지 브라우저</option>
          <option value="FireFox">파이어폭스 브라우저</option>
          <option value="Chrome">크롬 브라우저</option>
          <option value="Safari">사파리 브라우저</option>
          <option value="Opera">오페라 브라우저</option>
        </datalist>

        <br><br>
        <button type="submit">전송</button>
      </form>
    </div>
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
