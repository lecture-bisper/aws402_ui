<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>

  <div class="container mt-5">
    <h2>off canvas 슬라이드 메뉴</h2>
    <!-- 특정 버튼을 클릭 시 숨겨진 슬라이드 메뉴가 표시되는 off canvas 를 부트스트랩에서 제공함 -->
    <!-- <div> 태그에 .offcanvas 클래스와 id 값을 설정 -->
    <!-- 오프캔버스는 전체 화면을 사용하기 때문에 container 밖에 있어야 함 -->
    <!-- 오프캔버스는 .offcanvas-header, .offcanvas-body 2개의 div 태그로 구성됨 -->
    <!-- 헤더 영역에는 메뉴의 제목 및 닫기 버튼을 입력 -->
    <!-- 닫기 버튼은 반드시 data-bs-dismiss="offcanvas" 속성을 추가 -->
    <!-- 오프캔버스를 호출 할 <button> 태그에 data-bs-toggle="offcanvas", data-bs-target="오프캔버스의 id 값" 속성을 추가 -->

    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#off-1">
      클릭 시 왼쪽 메뉴 출력
    </button>
    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#off-2">
      클릭 시 오른쪽 메뉴 출력
    </button>

    <div class="bg-warning-subtle text-center" style="height: 2000px;">
      <h3>내용</h3>
      <h3>내용</h3>
      <h3>내용</h3>
      <h3>내용</h3>
      <h3>내용</h3>
      <h3 class="text-primary">내용</h3>
      <h3 class="text-primary">내용</h3>
      <h3 class="text-primary">내용</h3>
      <h3 class="text-primary">내용</h3>
      <h3 class="text-primary">내용</h3>
      <h3 class="text-success">내용</h3>
      <h3 class="text-success">내용</h3>
      <h3 class="text-success">내용</h3>
      <h3 class="text-success">내용</h3>
      <h3 class="text-success">내용</h3>
      <h3 class="text-info">내용</h3>
      <h3 class="text-info">내용</h3>
      <h3 class="text-info">내용</h3>
      <h3 class="text-info">내용</h3>
      <h3 class="text-info">내용</h3>
      <h3 class="text-warning">내용</h3>
      <h3 class="text-warning">내용</h3>
      <h3 class="text-warning">내용</h3>
      <h3 class="text-warning">내용</h3>
      <h3 class="text-warning">내용</h3>
    </div>
  </div>


  <!-- 오프캔버스에 .offcanvas-방향 클래스를 추가하여 슬라이드 메뉴의 위치를 설정할 수 있음 -->
  <!-- .offcanvas-start, .offcanvas-top, .offcanvas-bottom, .offcanvas-end -->
  <!-- data-bs-scroll="true" 속성을 추가 시 슬라이드 메뉴가 출력되어도 스크롤이 가능 -->
  <!-- data-bs-backdrop="static" 속성 추가 시 슬라이드 메뉴의 닫기 버튼을 눌러야 슬라이드 메뉴가 사라짐 -->
  <!-- data-bs-backdrop="false" 속성 추가 시 배경이 어두워지지 않음 -->
  <div id="off-1" class="offcanvas offcanvas-start" data-bs-scroll="true" data-bs-backdrop="static">
    <div class="offcanvas-header">
      <h1 class="offcanvas-title">메뉴 타이틀</h1>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p>슬라이드 메뉴 내용1</p>
      <p>슬라이드 메뉴 내용1</p>
      <p>슬라이드 메뉴 내용1</p>
      <div class="d-grid gap-2 mt-3">
        <button type="button" class="btn btn-success">그냥 버튼</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">닫기</button>
      </div>
    </div>
  </div>

  <div id="off-2" class="offcanvas offcanvas-end">
    <div class="offcanvas-header">
      <h1 class="offcanvas-title">메뉴 타이틀</h1>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <p>슬라이드 메뉴 내용1</p>
      <p>슬라이드 메뉴 내용1</p>
      <p>슬라이드 메뉴 내용1</p>
      <div class="d-grid gap-2 mt-3">
        <button type="button" class="btn btn-success">그냥 버튼</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">닫기</button>
      </div>
    </div>
  </div>
</body>

</html>
