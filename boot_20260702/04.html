<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>

  <div class="container mt-5">
    <h2>form 태그</h2>
    <!-- 부트스트랩에서 form 과 관련된 태그의 디자인은 변경하여 제공함 -->

    <div>
      <h3>input</h3>
      <!-- 사용자가 정보를 입력하기 위한 <input> 태그에 .form-control 클래스를 추가하여 사용 -->
      <!-- 주로 <input> 태그와 <label> 태그를 한쌍으로 <div> 태그에 묶어서 사용 -->
      <!-- <label> 태그에 .form-label 클래스를 사용 -->

      <form method="get">
        <div class="mt-3">
          <label for="user-id" class=".form-label">사용자 ID</label>
          <input type="text" class="form-control" id="user-id" name="userId" placeholder="사용자 ID를 입력하세요">
        </div>
        <div class="mt-3">
          <label for="user-pwd" class=".form-label">사용자 비밀번호</label>
          <input type="password" class="form-control" id="user-pwd" name="userPwd" placeholder="사용자 비밀번호를 입력하세요">
        </div>
        <button type="submit" class="btn btn-primary mt-3">확인</button>
      </form>
    </div>

    <br>
    <hr><br>

    <div>
      <h3>inline form</h3>
      <!-- 한 라인에 여러 개의 input 태그를 사용할 경우 grid system 을 활용 -->
      <!-- .row 및 .col 클래스를 사용하여 grid system 을 적용하고, 그 안에 input 태그를 입력 -->

      <form action="#" method="get">
        <div class="row">
          <div class="col-6">
            <input type="text" class="form-control" placeholder="사용자 ID 를 입력하세요">
          </div>
          <div class="col-6">
            <input type="password" class="form-control" placeholder="사용자 비밀번호를 입력하세요">
          </div>
        </div>
      </form>
      <br>
      <form action="#" method="get">
        <div class="row">
          <div class="col">
            <input type="text" class="form-control" placeholder="사용자 ID 를 입력하세요">
          </div>
          <div class="col">
            <input type="password" class="form-control" placeholder="사용자 비밀번호를 입력하세요">
          </div>
          <div class="col-1 d-grid">
            <button type="submit" class="btn btn-primary">확인</button>
          </div>
        </div>
      </form>
    </div>

    <br>
    <hr><br>

    <div>
      <h3>form 크기 설정, 활성/비활성, 읽기전용, plaintext, color picker</h3>
      <!-- <input> 태그에 .form-control-sm, .form-control-lg 클래스를 추가하여 크기 설정 -->
      <!-- <input> 태그에 disabled, readonly 속성을 추가하여 비활성화, 읽기 전용으로 설정 -->
      <!-- <input> 태그에 .active 클래스 추가 시 활성화로 표시 됨 -->
      <!-- <input> 태그에 .form-control 클래스 대신 .form-control-plaintext 클래스 사용 시 테두리가 없는 텍스트박스를 사용할 수 있음 -->
      <!-- <input> 태그에 .form-control-color 클래스를 추가하여 색상을 선택하는 color picker 사용 -->
      <form action="#">
        <div class="mt-3">
          <label for="large" class="form-label">큰 input</label>
          <input type="text" class="form-control form-control-lg" id="large">
        </div>
        <div class="mt-3">
          <label for="normal" class="form-label">기본 input</label>
          <input type="text" class="form-control" id="normal">
        </div>
        <div class="mt-3">
          <label for="small" class="form-label">작은 input</label>
          <input type="text" class="form-control form-control-sm" id="small">
        </div>
        <div class="mt-3">
          <label for="act" class="form-label">활성화된 input</label>
          <input type="text" class="form-control active" id="act">
        </div>
        <div class="mt-3">
          <label for="disable" class="form-label">비활성화된 input</label>
          <input type="text" class="form-control" id="disable" disabled>
        </div>
        <div class="mt-3">
          <label for="read" class="form-label">읽기전용 input</label>
          <input type="text" class="form-control" id="read" readonly>
        </div>
        <div class="mt-3">
          <label for="plain" class="form-label">plain text input</label>
          <input type="text" class="form-control-plaintext" id="plain">
        </div>
        <div class="mt-3">
          <label for="color" class="form-label">color picker</label>
          <input type="color" class="form-control form-control-color" id="color">
        </div>
      </form>
    </div>

    <br>
    <hr><br>

    <div>
      <h3>textarea</h3>
      <!-- <input> 태그 사용법과 동일함 -->
      <!-- 부트스트랩에서 제공하는 .form-control 클래스 사용 시 너비를 100% 로 사용하므로 cols 속성이 의미가 없음 -->
      <form action="">
        <div class="mt-3">
          <label for="comment" class="form-label">메모</label>
          <textarea class="form-control" id="comment" rows="5"></textarea>
        </div>
      </form>
    </div>

    <br>
    <hr><br>

    <div>
      <h3>select box</h3>
      <!-- select box 도 부스트랩트에서 디자인하여 제공 -->
      <!-- <select> 태그에 .form-select 클래스를 추가하여 사용 -->
      <!-- .form-select-lg, .form-select-sm 클래스를 추가하여 크기 설정 가능 -->
      <!-- <select> 태그에 disabled 속성을 추가하여 비활성화 가능 -->

      <div class="mt-3">
        <label for="sel1" class="form-label">작은 select box</label>
        <select id="sel1" class="form-select form-select-sm">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="mt-3">
        <label for="sel2" class="form-label">기본 select box</label>
        <select id="sel2" class="form-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="mt-3">
        <label for="sel3" class="form-label">큰 select box</label>
        <select id="sel3" class="form-select form-select-lg">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <br><br>

      <h3>datalist</h3>
      <!-- select box 와 비슷한 형태로 사용자의 데이터를 입력 받거나, 개발자가 제공하는 데이터를 선택하여 사용하는 형태의 태그 -->
      <!-- <input> 태그와, <datalist> 태그를 함께 선언 -->
      <!-- <input> 태그에 list 속성을 추가, list 속성값을 <datalist> 태그의 id값을 설정, .form-control 클래스를 사용 -->
      <!-- <datalist> 태그는 id 속성을 설정하고, 자식 태그로 <option> 태그를 사용 -->

      <div>
        <label for="list" class="form-label">웹 브라우저 선택 : </label>
        <input type="text" class="form-control" id="list" list="browserlist">
        <datalist id="browserlist">
          <option value="edge">Edge</option>
          <option value="firefox">FireFox</option>
          <option value="chrome">Chrome</option>
          <option value="safari">Safari</option>
          <option value="opera">Opera</option>
        </datalist>
      </div>
    </div>
  </div>


  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
