<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>

<body>

  <div class="container mt-5">
    <h2>캐러셀</h2>
    <!-- 광고를 위한 이미지 전환 슬라이더인 캐러셀을 부트스트랩에서 미리 만들어서 제공함 -->

    <!-- 부모 태그인 <div> 태그에 id 값을 설정, .carousel, .slide 클래스 및 data-bs-ride="carousel" 속성을 추가 -->
    <!-- 자식 태그로 <div> 태그를 선언하고, 3가지 구역으로 나눔(인디케이터, 슬라이더, 컨트롤) -->

    <!-- 인디케이터는 이미지 슬라이더 하단의 버튼을 의미, .carousel-indicators 클래스 사용 -->
    <!-- 인디케이터의 자식 태그로 <button> 태그를 사용하고, data-bs-target="최상위 부모의 id값", data-bs-slide-to="이미지 슬라이더 번호" 속성을 추가 -->
    <!-- 가장 처음에 동작할 인디케이터에 .active 클래스를 추가 -->

    <!-- 이미지 슬라이더는 <div> 태그를 사용하고, .carousel-inner 클래스를 사용 -->
    <!-- 슬라이더는 출력할 이미지의 수에 따라 .carousel-item 클래스를 사용하는 <div> 태그를 선언 -->
    <!-- .carousel-item 의 자식 태그로 <img> 태그를 사용하고, .d-block 클래스를 추가 -->
    <!-- 가장 처음 출력할 이미지 슬라이더에 .active 클래스를 추가 -->

    <!-- 컨트롤 버튼은 <button> 태그 2개를 사용하고, 각각 .carousel-control-prev, .carousel-control-next 클래스를 사용하며, data-bs-target="최상위 부모의 id값", data-bs-slide="prev|next" 속성을 추가 -->
    <!-- 자식 태그로 <span> 태그를 사용하고, 각각 .carousel-control-prev-icon, .carousel-control-next-icon 클래스를 추가 -->

    <!-- 캐러셀 본체 -->
    <!-- .carousel-fade 클래스 추가 시 이미지 전환이 슬라이드 형식에서 fade in/out 형식으로 변경 -->
    <div id="carousel-demo" class="carousel slide carousel-fade" data-bs-ride="carousel">

      <!-- 인디케이터 -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carousel-demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carousel-demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carousel-demo" data-bs-slide-to="2"></button>
      </div>

      <!-- 슬라이더 -->
      <!-- <img> 태그 아래에 <div> 태그 추가 후 .carousel-caption 클래스를 사용하면 설명문 입력 가능 -->
      <!-- .carousel-item 에 data-bs-interval="시간" 입력 시 이미지 전환 시간을 지정할 수 있음, 기본값 5초(1/1000초 로 계산) -->
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="images/chicago.jpg" alt="시카고" class="d-block w-100">
          <div class="carousel-caption">
            <h5>첫번째 슬라이드</h5>
            <p>하단 인디케이터나 좌우측의 컨트롤 버튼 클릭 시 슬라이더 이동</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="5000">
          <img src="images/la.jpg" alt="LA" class="d-block w-100">
          <div class="carousel-caption">
            <h5>두번째 슬라이드</h5>
            <p>하단 인디케이터나 좌우측의 컨트롤 버튼 클릭 시 슬라이더 이동</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="images/ny.jpg" alt="뉴욕" class="d-block w-100">
          <div class="carousel-caption">
            <h5>세번째 슬라이드</h5>
            <p>하단 인디케이터나 좌우측의 컨트롤 버튼 클릭 시 슬라이더 이동</p>
          </div>
        </div>
      </div>

      <!-- 컨트롤 -->
      <button type="button" class="carousel-control-prev" data-bs-target="#carousel-demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button type="button" class="carousel-control-next" data-bs-target="#carousel-demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>

</body>

</html>
