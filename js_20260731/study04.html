<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Title</title>

  <link rel="stylesheet" href="./css/bootstrap.css">
  <script src="./js/bootstrap.bundle.js"></script>

  <script>
  // 변수
  // 자바스크립트에서 변수를 사용하기 위한 키워드로 var, let, const 3가지를 사용함

  // var : 전통적인 방식의 변수 선언 키워드, 변수의 스코프가 함수를 기준으로 함, 변수의 재선언이 가능함
  // let : ES6 버전에서 추가된 변수 선언 키워드, 변수의 스코프가 코드블럭을 기준으로 함, 변수의 재선언이 불가
  // const : ES6 버전에서 추가된 상수 선언 키워드, 상수의 스코프가 코드블럭을 기준으로 함, 상수의 재선언이 불가

  var var1 = 10;
  let let1 = 10;
  const const1 = 10;

  console.log('var 를 사용한 var1 의 값 : ' + var1);
  console.log('let 을 사용한 let1 의 값 : ' + let1);
  console.log('const 를 사용한 const1 의 값 : ' + const1);

  var1 = 100;
  let1 = 100;
  // 상수이므로 수정 불가
  // const1 = 100;

  console.log('수정 후 var1 의 값 : ' + var1);
  console.log('수정 후 let1 의 값 : ' + let1);

  console.log('\n---------------\n');

  var var1 = 1000;
  // 위에서 선언한 이름으로 변수를 재선언 할 수 없음
  // let let1 = 1000;
  // 위에서 선언한 이름으로 상수를 재선언 할 수 없음
  // const const1 = 1000;

  console.log('재선언한 var1 : ' + var1);
  // console.log('재선언한 let1 : ' + let1);
  // console.log('재선언한 const1 : ' + const1);

  console.log('\n---------------\n');

  // 함수 선언
  function func1() {
      // 지역 변수 선언
      var var2 = 20;
      let let2 = 20;
      const const2 = 20;

      console.log("함수 func1 안에서 var2 : " + var2);
      console.log("함수 func1 안에서 let2 : " + let2);
      console.log("함수 func1 안에서 const2 : " + const2);
  }

  func1();

  // 함수 안에서 선언한 변수를 함수 밖에서 사용할 수 없음
  // console.log("함수 func1 밖에서 var2 : " + var2);
  // console.log("함수 func1 밖에서 let2 : " + let2);
  // console.log("함수 func1 밖에서 const2 : " + const2);

  console.log('\n');

  if (true) {
      // if 문 안에서 지역 변수 선언
      var var3 = 30;
      let let3 = 30;
      const const3 = 30;

      console.log("if문 안에서 var3 : " + var3);
      console.log("if문 안에서 let3 : " + let3);
      console.log("if문 안에서 const3 : " + const3);
  }

  console.log('\n');

  // var 는 변수의 스코프 범위가 함수를 기준으로 하므로 if 의 코드 블럭을 벗어나도 메모리에 살아있음
  console.log("if문 밖에서 var3 : " + var3);
  // let과 const 는 변수 스코프 범위가 코드블럭을 기준으로 하므로 코드 블럭을 벗어나면 메모리에서 삭제됨
  // console.log("if문 밖에서 let3 : " + let3);
  // console.log("if문 밖에서 const3 : " + const3);

  console.log('\n');

  for (let i = 0; i < 1; i++) {
      var var4 = 40;
      let let4 = 40;
      const const4 = 40;

      console.log("for문 안에서 var4 : " + var4);
      console.log("for문 안에서 let4 : " + let4);
      console.log("for문 안에서 const4 : " + const4);
  }

  console.log('\n');

  console.log("for문 밖에서 var4 : " + var4);
  // console.log("for문 밖에서 let4 : " + let4);
  // console.log("for문 밖에서 const4 : " + const4);

  console.log('\n---------------\n');

  // const 는 상수이기 때문에 한번 저장한 값을 수정할 수 없음
  // const 에 배열이 저장되었을 경우 배열 자체는 수정할 수 없음 하지만 저장된 배열의 요소는 변경할 수 있음
  // const 에 배열이 저장되면 배열의 주소가 저장되기 때문에 배열 자체를 교체하려고 할 경우 저장된 주소가 변경되는 것이므로 수정 불가
  // const 에 배열을 저장하고, 해당 배열의 요소를 수정하는 것은 해당 배열의 주소가 변경되는 것이 아니기 때문에 배열의 요소는 변경할 수 있음

  let arrNum1 = [10, 20, 30, 40, 50];
  const arrNum2 = [10, 20, 30, 40, 50];

  console.log(arrNum1);
  console.log(arrNum2);

  arrNum1 = [60, 70, 80, 90, 100];
  // 상수에 배열 저장 후 해당 배열을 수정 시 오류 발생
  // arrNum2 = [60, 70, 80, 90, 100];

  console.log(arrNum1);
  // console.log(arrNum2);

  arrNum2[0] = 60;
  arrNum2[1] = 70;
  arrNum2[2] = 80;
  arrNum2[3] = 90;
  arrNum2[4] = 100;
  console.log(arrNum2);

  </script>
</head>
<body>

</body>
</html>
