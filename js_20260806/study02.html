<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이벤트2</title>

  <link rel="stylesheet" href="css/bootstrap.css">
  <script src="js/bootstrap.bundle.js"></script>

  <script>
    window.addEventListener('load', function () {
        alert('문서 로드 이벤트 동작!!');
    });

    window.addEventListener('resize', function () {
        console.log('문서 크기 변경 이벤트!!');
    });

    window.addEventListener('scroll', function () {
        console.log('스크롤 이벤트 발생!!');
    });

    window.addEventListener('DOMContentLoaded', function () {
        const frm = document.querySelector('#frm');
        frm.addEventListener('submit', function(event) {
            // 현재 이벤트 처리 중지
            event.preventDefault();

            alert('submit 이벤트 발생!!');
        });

        frm.addEventListener('reset', function() {
            alert('reset 이벤트 발생!!');
        });

        const select = document.querySelector('#sel1');
        select.addEventListener('change', function() {
            alert('change 이벤트 발생!!');
        });

        const input1 = document.querySelector('#input1');
        input1.addEventListener('focus', function() {
            console.log('focus 이벤트 발생!!');
        });

        input1.addEventListener('blur', function() {
            alert('blur 이벤트 발생');
        });

    });
  </script>
</head>
<body>

<div class="container mt-5" style="height: 2000px">
  <h1 class="text-center">문서로딩 이벤트, form 이벤트</h1>

  <h3>문서 로딩 이벤트</h3>
  <br><hr><br>

  <h3>form 이벤트</h3>
  <div>
    <div class="mt-3">
      <label for="focus-event">focus / blur 이벤트</label>
      <input type="text" class="form-control" id="focus-event">
    </div>
    <div class="mt-3">
      <select id="sel1" class="form-control">
        <option value="선택1" selected>선택1</option>
        <option value="선택2">선택2</option>
        <option value="선택3">선택3</option>
        <option value="선택4">선택4</option>
        <option value="선택5">선택5</option>
      </select>
    </div>

    <br>
    <a href="https://www.naver.com" class="btn btn-link">네이버 홈페이지</a>
    <br>


    <form action="#" id="frm" class="mt-3">
      <input type="text" class="form-control" placeholder="아무꺼나 입력하세요" id="input1">
      <br>
      <input type="number" class="form-control" value="5" min="0" max="10" id="input2">
      <br>
      <button type="submit" class="btn btn-primary">submit 이벤트</button>
      <button type="reset" class="btn btn-warning">reset 이벤트</button>
    </form>
  </div>

</div>

</body>
</html>
