<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .box {
      width: 150px;
      height: 150px;
      border: 2px solid black;
      margin: 8px;
      padding: 8px;
    }

    .red {
      background-color: red;
    }

    .green {
      background-color: #00FF00;
    }

    .blue {
      background-color: rgb(0, 0, 255);
    }

    .inline {
      display: inline;
    }

    .block {
      display: block;
    }

    .inline-block {
      display: inline-block;
    }

    .d-none {
      display: none;
    }

    .opacity-0 {
      opacity: 1.0;
    }

    .hidden {
      visibility: visible;
    }
  </style>
</head>

<body>

  <div id="div01">
    <h2>display: inline 사용</h2>

    <!-- div 태그는 기본적으로 display: block 로 설정되어 있음 -->
    <div class="box red"></div>
    <div class="box green"></div>
    <div class="box blue"></div>
    <br>
    <div class="box red inline">inline 사용</div>
    <div class="box green inline">inline 사용</div>
    <div class="box blue inline">inline 사용</div>

    <br><br>

    <h2>display: block 사용</h2>

    <div>
      <!-- img 태그는 기본적으로 display: inline 으로 설정되어 있음 -->
      <img src="cat01.jpg" alt="" style="width: 300px;">
      <img src="cat02.jpg" alt="" style="width: 300px;">
      <img src="cat03.jpg" alt="" style="width: 300px;">
      <br>
      <img src="cat01.jpg" alt="" style="width: 300px;" class="block">
      <img src="cat02.jpg" alt="" style="width: 300px;" class="block">
      <img src="cat03.jpg" alt="" style="width: 300px;" class="block">
    </div>

    <br><br>

    <h2>display: inline-block 사용</h2>

    <div>
      <div class="box red inline">inline 사용</div>
      <div class="box green inline-block">inline-block 사용</div>
      <div class="box blue inline">inline 사용</div>
    </div>

    <br><br>

    <h2>display: none 사용</h2>

    <div>
      <div class="box blue hidden">visibility: hidden 사용</div>
      <div class="box green d-none">display: none 사용</div>
      <div class="box red opacity-0">opacity: 0 사용</div>
    </div>
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
