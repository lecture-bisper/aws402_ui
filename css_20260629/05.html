<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .container {
      max-width: 1200px;
      border: 1px dashed darkgray;
      margin: 50px auto 0px;
    }

    .box {
      width: 100px;
      padding: 30px;
      margin: 16px;
      border: 1px solid black;
      text-align: center;
    }

    .bg {
      background-color: #EEEEEE;
      border: 1px solid #222222;
    }

    .red {
      background-color: red;
    }

    .green {
      background-color: #00FF00;
    }

    .blue {
      background-color: blue;
    }

    .flexbox {
      display: flex;
      background-color: #EEEEEE;
      border: 1px solid #222222;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>flexbox 사용하기2</h2>
    <div>
      <h3>flex-shrink</h3>

      <!-- flex-shrink 는 플렉스박스 안의 자식 태그가 축소될 경우 축소되는 비율을 지정, 기본값 1, 0으로 설정 시 크기가 줄어들지 않음 -->
      <div class="flexbox bg">
        <div class="box red" style="flex-grow: 1;">1</div>
        <div class="box green" style="flex-grow: 1;">2</div>
        <div class="box blue" style="flex-shrink: 3; flex-grow: 1;">3</div>
        <div class="box red" style="flex-grow: 1;">4</div>
        <div class="box green" style="flex-grow: 1;">5</div>
      </div>
    </div>

    <br>
    <hr><br>

    <h3>flex-basis</h3>

    <!-- flex-basis 는 지정한 태그의 초기 크기를 지정함 -->
    <div class="flexbox bg">
      <div class="box red">1</div>
      <div class="box green">2</div>
      <div class="box blue" style="flex-basis: 250px;">3</div>
      <div class="box red">4</div>
    </div>
  </div>

  <br>
  <hr><br>

  <div>
    <h3>flex</h3>

    <!-- flex 는 flex-grow, flex-shrink, flex-basis 속성을 한번에 입력 시 사용 -->
    <div class="flexbox bg">
      <div class="box red">1</div>
      <div class="box green">2</div>
      <div class="box blue" style="flex: 1 3 250px;">3</div>
      <div class="box red" style="flex: 0 0 200px">4</div>
    </div>

    <br>
    <hr><br>

    <div>
      <h3>order</h3>
      <!-- order 는 플렉스박스의 자식 태그를 배치하는 순서를 직접 지정할 수 있음, 자식 태그에 설정 -->
      <div class="flexbox bg">
        <div class="box red" style="order: 4;">1</div>
        <div class="box green" style="order: 1;">2</div>
        <div class="box blue" style="order: 2;">3</div>
        <div class="box red" style="order: 5;">4</div>
        <div class="box green" style="order: 3;">5</div>
      </div>

      <br>

      <div class="flexbox bg">
        <div class="box green">2</div>
        <div class="box blue">3</div>
        <div class="box green">5</div>
        <div class="box red">1</div>
        <div class="box red">4</div>
      </div>
    </div>
  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
