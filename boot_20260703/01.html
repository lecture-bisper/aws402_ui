<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- 문제1 ) https://www.w3schools.com/w3css/tryw3css_examples_pricing_tables.htm 를 클론코딩 하세요 -->

  <style>
    .shadowbox:hover {
      box-shadow: 5px 5px 7px lightgray, -5px -3px 5px lightgrey;
    }
  </style>
</head>

<body>

  <div class="container-fluid mt-5">
    <h2>Responsive Pricing Tables</h2>
    <div class="row">
      <div class="col">
        <div class="text-center border shadowbox">
          <div class="bg-dark py-4">
            <h4 class="text-white">Basic</h4>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>10GB</strong> storage</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>10</strong> Emails</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>10</strong> Domains</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>Endless</strong> support</p>
          </div>
          <div class="py-3 border-bottom">
            <h4 class="m-0">$ 10</h4>
            <p class="m-0 text-secondary">per month</p>
          </div>
          <div class="py-4 bg-secondary-subtle">
            <button type="button" class="btn btn-success rounded-0">Sign up</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="text-center border shadowbox">
          <div class="bg-success py-4">
            <h4 class="text-white">Pro</h4>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>25GB</strong> storage</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>25</strong> Emails</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>25</strong> Domains</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>Endless</strong> support</p>
          </div>
          <div class="py-3 border-bottom">
            <h4 class="m-0">$ 25</h4>
            <p class="m-0 text-secondary">per month</p>
          </div>
          <div class="py-4 bg-secondary-subtle">
            <button type="button" class="btn btn-success rounded-0">Sign up</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="text-center border shadowbox">
          <div class="bg-dark py-4">
            <h4 class="text-white">Premium</h4>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>50GB</strong> storage</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>50</strong> Emails</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>50</strong> Domains</p>
          </div>
          <div class="py-3 border-bottom">
            <p class="m-0"><strong>Endless</strong> support</p>
          </div>
          <div class="py-3 border-bottom">
            <h4 class="m-0">$ 50</h4>
            <p class="m-0 text-secondary">per month</p>
          </div>
          <div class="py-4 bg-secondary-subtle">
            <button type="button" class="btn btn-success rounded-0">Sign up</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
