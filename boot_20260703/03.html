<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</head>
<body>
  
  <div class="container mt-5">
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#login-modal">Login</button>
  </div>

  <div class="modal fade" id="login-modal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <!-- 모달창 header -->
        <div class="modal-header border-bottom-0">
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- 모달창 body -->
        <div class="modal-body">
          <div>
            <img src="images/img_avatar4.png" alt="" class="d-block mx-auto rounded-circle" style="max-width: 180px; max-height: 180px;">
          </div>
          <form action="#" method="post">
            <div class="mt-3">
              <label for="user-name" class="form-label">Username</label>
              <input type="text" class="form-control" id="user-name" name="userName" placeholder="Enter Username">
            </div>
            <div class="mt-3">
              <label for="user-pwd" class="form-label">Password</label>
              <input type="password" class="form-control" id="user-pwd" name="userPwd" placeholder="Enter Password">
            </div>
            <div class="mt-3 d-grid gap-2">
              <button type="submit" class="btn btn-success">Login</button>
            </div>
            <div class="mt-4">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember" checked>
                <label for="remember" class="form-check-label">Remember me</label>
              </div>
            </div>
          </form>
        </div>

        <!-- 모달창 footer -->
        <div class="modal-footer">
          <div class="d-flex justify-content-between w-100">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal" style="width: 100px;">Cancel</button>
            <div class="py-3">
              <p class="m-0">Forgot <a href="#" class="text-black">password?</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
