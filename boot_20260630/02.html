<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부트스트랩 grid 시스템</title>

  <link rel="stylesheet" href="css/bootstrap.css">
  <script src="js/bootstrap.bundle.js"></script>
</head>

<body>

  <div class="container mt-5">
    <h2>그리드 시스템</h2>
    <!-- Grid System : CSS에서 배웠던 화면을 12칸으로 구분하여 컨텐츠를 배치하는 시스템을 말함 -->
    <!-- Bootstrap 의 grid system 은 css의 grid system 과 동일함 -->
    <!-- 1 개의 라인을 12 칸으로 구분하고 컨텐츠를 배치하여 사용 -->

    <!-- 부스트랩에서는 grid system 을 사용하기 위해서 row, col 이라는 2개의 클래스를 사용하여 구현 -->
    <!-- .row 는 1개의 라인을 의미, .col 은 1개의 column 을 의미 -->
    <!-- .row 를 부모 태그에 사용, .col 을 자식 태그에 사용하여 총 12칸의 column 을 생성 -->
    <!-- .col-x 를 사용하여 총 12칸을 생성 -->
    <!-- 2칸 이상 크기의 column 을 사용할 경우 .col-2, .col-3, .col-4, .col-6 의 형식으로 column 을 합하여 큰 column 을 만들 수 있음 (.col-x 의 총합이 12를 넘으면 안됨) -->

    <div class="row">
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">1(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">2(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">3(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">4(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">5(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">6(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">7(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">8(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">9(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">10(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">11(1)</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-1">12(1)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">1(2)</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">2(2)</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">3(2)</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">4(2)</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">5(2)</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-2">6(2)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">1(3)</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">2(3)</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">3(3)</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">4(3)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-warning-subtle text-center border border-dark col-4">1(4)</div>
      <div class="p-1 bg-warning-subtle text-center border border-dark col-4">2(4)</div>
      <div class="p-1 bg-warning-subtle text-center border border-dark col-4">3(4)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-danger-subtle text-center border border-dark col-6">1(6)</div>
      <div class="p-1 bg-danger-subtle text-center border border-dark col-6">2(6)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-secondary-subtle text-center border border-dark col-4">1(4)</div>
      <div class="p-1 bg-secondary-subtle text-center border border-dark col-8">2(8)</div>
    </div>

    <br>

    <div class="row">
      <div class="p-1 bg-dark-subtle text-center border border-dark col-12">1(12)</div>
    </div>

    <br><br>

    <!-- 부트스트랩의 grid system 사용 시 반응형 웹을 지원 -->
    <!-- .col-x 형태로 입력하는 것을 .col-**-x 형태로 입력 -->
    <!-- ** : 화면의 크기를 지정(생략 가능) -->
    <!-- 화면 크기는 반응형 웹을 위한 sm, md, lg, xl, xxl -->
    <!-- x : 합쳐진 column 의 크기 (생략 가능) -->
    <!-- x 의 경우 column 의 크기를 생략하면 column 의 크기를 자동 계산 함 -->
    <div class="row">
      <div class="p-1 bg-primary-subtle text-center border border-dark col-sm-3">col-sm-3</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-md-3">col-md-3</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-lg-3">col-lg-3</div>
      <div class="p-1 bg-primary-subtle text-center border border-dark col-xl-3">col-xl-3</div>
    </div>
    <br>
    <div class="row">
      <div class="p-1 bg-info-subtle text-center border border-dark col">col-3</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col">col-3</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col">col-3</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col">col-3</div>
    </div>
    <br>
    <div class="row">
      <div class="p-1 bg-success-subtle text-center border border-dark col-sm">col-sm</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-md">col-md</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-lg">col-lg</div>
      <div class="p-1 bg-success-subtle text-center border border-dark col-xl">col-xl</div>
    </div>


    <br><br>

    <div class="row">
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">
        <button type="button" class="btn btn-primary">버튼</button>
      </div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3 d-grid">
        <button type="button" class="btn btn-primary">전체 크기 버튼</button>
      </div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">col-3</div>
      <div class="p-1 bg-info-subtle text-center border border-dark col-3">
        <button type="button" class="btn btn-primary">버튼</button>
      </div>
    </div>

    <br><br>

    <!-- grid system 은 하나의 라인에 12 칸을 적용시켜서 사용하는 것이나 2중으로 겹쳐서 사용이 가능 -->
    <!-- 칸을 의미하는 .col 의 자식 태그로 div 를 선언하고 .row 와 .col 을 사용하면 grid system 을 겹쳐서 사용이 가능함 -->

    <div class="row">
      <div class="p-1 bg-warning-subtle text-center border border-dark col-6">col-6</div>
      <div class="p-1 bg-warning-subtle text-center border border-dark col-6">
        <div class="row">
          <div class="p-1 m-1 bg-danger-subtle text-center border col">col-4</div>
          <div class="p-1 m-1 bg-danger-subtle text-center border col">col-4</div>
          <div class="p-1 m-1 bg-danger-subtle text-center border col">col-4</div>
        </div>
      </div>
    </div>

  </div>

  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
