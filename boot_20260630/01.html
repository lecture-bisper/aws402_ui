<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부트스트랩을 사용한 웹 페이지</title>

  <!-- 부트스트랩 설치 방법 -->
  <!-- 1. 부트스트랩 파일을 다운로드하여 프로젝트에 복사하여 <link>, <script> 로 호출해 사용 -->
  <!-- <link rel="stylesheet" href="css/bootstrap.css">
  <script src="js/bootstrap.bundle.js"></script> -->

  <!-- 2. 부트스트랩 파일을 CDN 을 통하여 인터넷에서 직접 호출하여 사용 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- 3. npm을 통해서 프로젝트에 설치(react 사용 시 사용) -->
  <!-- > npm install bootstrap -->
</head>

<body>

  <!-- 부트스트랩 : 쉽고 빠른 웹 개발을 위한 프론트엔드 UI 프레임워크 -->
  <!-- 타이포그라피, 버튼, 테이블, form, 모달창, 캐러셀과 같은 디자인 템플릿과 자바스크립트 플러그인이 포함되어 있음 -->
  <!-- 반응형 웹을 쉽게 적용할 수 있음 -->
  <!-- html 태그의 class 속성에 부트스트랩에서 미리 지정한 클래스명을 입력하여 부트스트랩에서 제공하는 디자인을 적용하여 사용 -->
  <h1>부트스트랩을 사용한 텍스트</h1>

  <button type="button">기본버튼</button>
  <button type="button" class="btn">부트스트랩 기본버튼</button>
  <button type="button" class="btn btn-primary">부트스트랩 적용 버튼</button>
  <button type="button" class="btn btn-outline-primary">부트스트랩 적용 버튼2</button>

  <br><br>

  <div class="container">
    <h1>부스트랩트의 컨테이너</h1>

    <!-- 컨테이너 : 웹 사이트의 컨텐츠를 표시하기 위한 베이스 영역 -->
    <!-- 부트스트랩에서는 2가지의 컨테이너를 제공함 -->
    <!-- 고정 너비 컨테이너 : .container 를 사용, 좌우측에 여백이 존재하는 컨테이너, 화면의 너비가 특정 크기 이상일 경우 화면이 너비가 변경되더라도 컨테이너의 너비는 계속 동일한 컨테이터 -->
    <!-- 전체 너비 컨테이너 : .container-fluid 를 사용, 좌우측에 여백이 존재하지 않는 컨테이너, 화면의 너비 전체를 사용하므로 화면의 너비가 변경되면 컨테이너의 너비도 계속 변경되는 컨테이너 -->

    <!-- 고정 너비 컨테이너의 크기 -->
    <!-- 576px 미만 : 최대 너비 100% -->
    <!-- 576px 이상 (sm) : 최대 너비 540px -->
    <!-- 768px 이상 (md) : 최대 너비 720px -->
    <!-- 992px 이상 (lg) : 최대 너비 960px -->
    <!-- 1200px 이상 (xl) : 최대 너비 1140px -->
    <!-- 1400px 이상 (xxl) : 최대 너비 1320px -->
    <!-- 반응형 웹을 지원하기 위해서 .container-sm, .container-md, .container-lg, .container-xl, .container-xxl 이 존재함 -->
  </div>

  <br><br>

  <div class="container"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">고정 너비
    컨테이너(.container 사용)</div>
  <br>
  <div class="container-fluid"
    style="border: 2px dotted black; padding: 16px; background-color: lightcoral; text-align: center;">전체 너비
    컨테이너(.container-fluid 사용)</div>

  <br><br>

  <div class="container"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container</div>
  <br>
  <div class="container-sm"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container-sm
  </div>
  <br>
  <div class="container-md"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container-md
  </div>
  <br>
  <div class="container-lg"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container-lg
  </div>
  <br>
  <div class="container-xl"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container-xl
  </div>
  <br>
  <div class="container-xxl"
    style="border: 2px dashed black; padding: 16px; background-color: lightblue; text-align: center;">.container-xxl
  </div>
  <br>


  <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>

</html>
